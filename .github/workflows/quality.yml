name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository
        run: python3 scripts/ci/validate_repo.py
      - name: Validate router package manifest
        run: python3 scripts/ci/validate_router_package_manifest.py
      - name: Validate router feed manifest
        run: python3 scripts/ci/validate_router_feed_manifest.py
      - name: Validate pinned HRNeo release manifest
        run: python3 scripts/ci/validate_hrneo_release_manifest.py
      - name: Validate VPS runtime manifest
        run: python3 scripts/ci/validate_vps_runtime_manifest.py
      - name: Validate VPS container-shape evidence
        run: python3 scripts/ci/validate_vps_container_shape.py
      - name: Validate pinned Amnezia AWG upstream evidence
        run: python3 scripts/ci/validate_vps_awg_upstream.py
      - name: Validate live AWG backup evidence
        run: python3 scripts/ci/validate_vps_live_awg_backup.py
      - name: Validate live VPS rescue evidence
        run: python3 scripts/ci/validate_vps_rescue_evidence.py
      - name: Validate VPS rescue manifest
        run: python3 scripts/ci/validate_vps_rescue_manifest.py
      - name: Validate VPS network upstream evidence
        run: python3 scripts/ci/validate_vps_network_upstream.py
      - name: Validate live DNS persistence evidence
        run: python3 scripts/ci/validate_vps_dns_persistence_evidence.py
      - name: Validate DNS persistence desired state
        run: python3 scripts/ci/validate_vps_dns_persistence.py
      - name: Test inventory tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test installer contracts
        run: |
          sh tests/router-install-plan.sh
          sh tests/vps-install-plan.sh
          sh tests/backup-restore-contract.sh
          sh tests/installer-sandbox-transaction.sh
          sh tests/router-feed-config.sh
          sh tests/router-hrneo-artifact.sh
          sh tests/router-hrneo-rescue.sh
          sh tests/router-hrneo-opkg-state.sh
          sh tests/router-hrneo-opkg-status.sh
          sh tests/live-validation-contract.sh
          sh tests/vps-runtime-preflight.sh
          sh tests/vps-container-shape.sh
          sh tests/vps-desired-state-renderer.sh
          sh tests/vps-awg-backup.sh
          sh tests/vps-awg-restore-sandbox.sh
          sh tests/vps-image-backup.sh
          sh tests/vps-adguard-backup.sh
          sh tests/vps-adguard-restore-sandbox.sh
          sh tests/vps-rescue-set.sh
          sh tests/vps-live-restore-readiness.sh
          sh tests/vps-restore-rehearsal.sh
          sh tests/vps-live-awg-restore-validation.sh
          sh tests/vps-live-adguard-restore-validation.sh
          sh tests/vps-dns-redirect-contract.sh
          sh tests/vps-dns-persistence-preflight.sh
          sh tests/vps-dns-persistence-plan.sh
          sh tests/vps-dns-helper-analysis.sh
      - name: Test router doctor matcher
        run: HOMEROUTE_DOCTOR_SELFTEST=1 sh router/doctor-router.sh
