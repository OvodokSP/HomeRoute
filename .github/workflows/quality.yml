name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository
        run: python3 scripts/ci/validate_repo.py
      - name: Test inventory tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test installer contracts
        run: |
          sh tests/router-install-plan.sh
          sh tests/vps-install-plan.sh
          sh tests/backup-restore-contract.sh
